services:
  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public API URL for this deployment}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: "true"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set the public frontend origin}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:?Set the public gateway/API base URL}
      DATABASE_URL: ${DATABASE_URL:?Set the external RDS PostgreSQL connection string}
      JWT_SECRET: ${JWT_SECRET:?Set a production JWT signing secret}
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build: ./server
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the external RDS PostgreSQL connection string}
    command: ["npm", "run", "db:deploy"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - trafficflow-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trafficflow-redis-data: